name: PR Validate

on:
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` = `tsc -b && vite build`, so this also type-checks.
      # (`npx tsc --noEmit` checked nothing: the root tsconfig only has references.)
      - name: Build
        run: npm run build
